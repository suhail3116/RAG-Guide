<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fastshot — Describe an app. We'll build it.</title>
  <meta name="description" content="Fastshot turns a written description into a working app.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>document.documentElement.classList.add('anim');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
    }
    img, svg {
      display: block;
    }
    :focus-visible {
      outline: 2px solid #F8B285;
      outline-offset: 3px;
      border-radius: 4px;
    }

    :root {
      --u: min(0.06410256vw, 0.12400794vh);
      --vu: 0.09920635vh;
      --inset-top: 41;
      --inset-bottom: 106;

      /* Nav */
      --brand-x: 225; --brand-y: 45; --mark: 34; --brand-gap: 12; --brand-fs: 18.49;
      --links-y: 50.5; --links-gap: 50; --links-fs: 21.69;
      --cta-x: 1195; --cta-y: 42; --cta-w: 140; --cta-h: 43; --cta-r: 12; --cta-fs: 15.70; --cta-dy: 2;

      /* Hero */
      --hero-gap: 51;
      --h1-y: 323; --h1-fs: 36.25; --display-ls: 0.0018em;
      --nav-ls: -0.0115em; --brand-ls: -0.0154em; --cta-ls: -0.0127em; --body-ls: 0.007em;
      --label-ls: normal; --model-ls: normal; --proof-ls: 0.0065em;
      --w-regular: 400; --w-display-wght: 410; --w-medium: 500; --w-semibold: 600;
      --w-display: var(--w-display-wght); --w-nav: 400; --w-brand: 500; --w-cta: 520;
      --w-body: var(--w-regular); --w-label: var(--w-medium);
      --w-model: var(--w-regular); --w-proof: 480;

      /* Composer */
      --card-x: 425; --card-y: 413; --card-w: 708; --card-h: 143; --card-r: 26;
      --ph-x: 452; --ph-y: 446; --ph-fs: 9.97;
      --chips-x: 444; --chips-y: 505; --chip-h: 30; --chip-r: 9; --chip-fs: 9.0; --chip-gap: 5.5;
      --son-fs: 10.4; --son-top: 15.5; --chev-gap: 6.2;
      --chev-x: 1013.5; --chev-y: 522.3;
      --att-x: 1043.2; --att-y: 515.1;
      --send-x: 1084; --send-y: 507; --send-d: 35;

      /* Footer */
      --by-y: 799; --by-fs: 14.01; --logo-y: 867; --logo-gap: 62;

      /* Fonts */
      --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-display: Inter, var(--font-text);

      /* Animation easings */
      --e-primary: cubic-bezier(.16, 1, .3, 1);
      --e-soft: cubic-bezier(.22, 1, .36, 1);
    }

    @supports (height: 100dvh) {
      :root {
        --u: min(0.06410256vw, 0.12400794dvh);
        --vu: 0.09920635dvh;
      }
    }

    @media (min-width: 1561px) {
      :root {
        --inset-top: 27;
        --inset-bottom: 74;
      }
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #0a0d12;
      overflow: hidden;
    }

    body {
      font-family: var(--font-text);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      color: #fff;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0a0d12;
    }

    .stage-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
    }

    /* NAV */
    header.nav {
      height: calc(43 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--brand-gap) * var(--u));
      text-decoration: none;
      color: #fff;
    }

    .brand .mark {
      width: calc(var(--mark) * var(--u));
      height: calc(var(--mark) * var(--u));
      display: block;
    }

    .wordmark {
      font-family: var(--font-display);
      font-size: calc(var(--brand-fs) * var(--u));
      font-weight: var(--w-brand);
      letter-spacing: var(--brand-ls);
      transform: translateY(calc(1 * var(--u)));
      font-variation-settings: "opsz" 32;
      text-shadow: 0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.30);
    }

    .links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: calc((var(--links-y) - var(--inset-top)) * var(--u));
      display: flex;
      align-items: center;
      gap: calc(var(--links-gap) * var(--u));
    }

    .nav-link {
      font-size: calc(var(--links-fs) * var(--u));
      font-weight: var(--w-nav);
      font-family: var(--font-text);
      letter-spacing: var(--nav-ls);
      line-height: 1.2;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, 0.32);
      transition: opacity 0.18s ease;
    }

    .nav-link:hover {
      opacity: 0.72;
    }

    .cta {
      width: calc(var(--cta-w) * var(--u));
      height: calc(var(--cta-h) * var(--u));
      border-radius: calc(var(--cta-r) * var(--u));
      font-size: calc(var(--cta-fs) * var(--u));
      font-weight: var(--w-cta);
      letter-spacing: var(--cta-ls);
      color: #fff;
      text-decoration: none;
      align-self: flex-start;
      margin-top: calc((var(--cta-y) - var(--inset-top)) * var(--u));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
      box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, 0.10), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, 0.28);
      transition: filter 0.18s ease, transform 0.1s ease;
    }

    .cta span {
      transform: translateY(calc(var(--cta-dy) * var(--u)));
    }

    .cta:hover {
      filter: brightness(1.16);
    }

    .cta:active {
      transform: translateY(1px);
    }

    .burger {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.14);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sheet {
      display: none;
    }

    /* HERO */
    main.hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--hero-gap) * var(--vu));
      padding-bottom: calc(4 * var(--vu));
    }

    .h1 {
      font-family: var(--font-display);
      font-size: calc(var(--h1-fs) * var(--u));
      font-weight: var(--w-display);
      line-height: 1.10;
      letter-spacing: var(--display-ls);
      color: #fff;
      font-variation-settings: "opsz" 32;
      text-shadow: 0 calc(2 * var(--u)) calc(22 * var(--u)) rgba(0, 0, 0, 0.30);
      text-align: center;
    }

    /* COMPOSER CARD */
    .card {
      width: calc(var(--card-w) * var(--u));
      height: calc(var(--card-h) * var(--u));
      border-radius: calc(var(--card-r) * var(--u));
      margin-right: calc(3 * var(--u));
      background: rgba(41, 41, 43, 0.955);
      backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
      -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
      box-shadow: inset 0 0 0 1px rgba(214, 228, 255, 0.14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, 0.30);
      position: relative;
    }

    .ph {
      position: absolute;
      left: calc((var(--ph-x) - var(--card-x)) * var(--u));
      top: calc((var(--ph-y) - var(--card-y)) * var(--u));
      right: calc(24 * var(--u));
      color: #8B8C8E;
      font-size: calc(var(--ph-fs) * var(--u));
      font-weight: var(--w-regular);
      line-height: 1.35;
      letter-spacing: var(--body-ls);
      white-space: nowrap;
      overflow: hidden;
      margin: 0;
    }

    .tools {
      position: absolute;
      left: calc((var(--chips-x) - var(--card-x)) * var(--u));
      top: calc((var(--chips-y) - var(--card-y)) * var(--u));
      height: calc(var(--chip-h) * var(--u));
      right: calc((var(--card-x) + var(--card-w) - 1134) * var(--u));
    }

    .chips {
      display: flex;
      align-items: center;
      gap: calc(var(--chip-gap) * var(--u));
    }

    .chip {
      height: calc(var(--chip-h) * var(--u));
      border-radius: calc(var(--chip-r) * var(--u));
      font-size: calc(var(--chip-fs) * var(--u));
      font-weight: var(--w-medium);
      color: #909093;
      line-height: 1;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.088) 0%, rgba(255, 255, 255, 0.050) 45%, rgba(255, 255, 255, 0.038) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      width: calc(var(--cw) * var(--u));
      padding-left: calc(var(--pl) * var(--u));
      gap: calc(var(--ig) * var(--u));
      transition: background 0.15s, color 0.15s;
    }

    .chip:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.07));
      color: #c8c8cb;
    }

    .chip span {
      transform: translateY(calc(2 * var(--u)));
    }

    /* RIGHT CLUSTER (.right) */
    .right {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .right > * {
      position: absolute;
      pointer-events: auto;
    }

    .model {
      left: calc((955 - var(--chips-x) - 0.8) * var(--u));
      top: calc(var(--son-top) * var(--u));
      font-size: calc(var(--son-fs) * var(--u));
      font-weight: var(--w-model);
      color: #98999C;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: calc(var(--chev-gap) * var(--u));
      cursor: pointer;
    }

    .attach {
      left: calc((var(--att-x) - var(--chips-x)) * var(--u));
      top: calc((var(--att-y) - var(--chips-y)) * var(--u));
      color: #A9AAAD;
      cursor: pointer;
      transition: color 0.15s;
    }

    .attach:hover {
      color: #FFFFFF;
    }

    .send {
      left: calc((var(--send-x) - var(--chips-x)) * var(--u));
      top: calc((var(--send-y) - var(--chips-y)) * var(--u));
      width: calc(var(--send-d) * var(--u));
      height: calc(var(--send-d) * var(--u));
      border-radius: 50%;
      background: linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
      box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(210, 110, 60, 0.34);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.15s, transform 0.15s;
    }

    .send:hover {
      filter: brightness(1.07);
    }

    .send:active {
      transform: scale(0.95);
    }

    /* FOOTER */
    footer.proof {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(52.3 * var(--vu));
    }

    .caption {
      font-family: var(--font-display);
      font-size: calc(var(--by-fs) * var(--u));
      font-weight: var(--w-proof);
      letter-spacing: var(--proof-ls);
      color: rgba(255, 255, 255, 0.95);
      font-variation-settings: "opsz" 32;
      text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, 0.35);
      margin: 0;
    }

    .logos {
      display: flex;
      align-items: center;
      gap: calc(var(--logo-gap) * var(--u));
      filter: drop-shadow(0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.30));
      color: #FFFFFF;
    }

    /* ENTRANCE ANIMATIONS */
    @keyframes e-settle-down {
      from { opacity: 0; transform: translateY(calc(-5 * var(--u))); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-settle-up {
      from { opacity: 0; transform: translateY(calc(6 * var(--u))); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-mark {
      from { transform: scale(0.9); }
      to { transform: none; }
    }
    @keyframes e-focus {
      from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); }
      to { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes e-panel {
      from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-populate {
      from { opacity: 0; transform: translateY(calc(4 * var(--u))); }
      to { opacity: 1; transform: none; }
    }
    @keyframes e-send {
      from { transform: scale(0.82); }
      to { transform: none; }
    }

    html.anim .brand { animation: e-settle-down 0.58s var(--e-soft) 0.06s both; }
    html.anim .brand .mark { animation: e-mark 0.62s var(--e-primary) 0.06s both; }
    html.anim .nav-link:nth-child(1) { animation: e-settle-down 0.50s var(--e-soft) 0.16s both; }
    html.anim .nav-link:nth-child(2) { animation: e-settle-down 0.50s var(--e-soft) 0.21s both; }
    html.anim .nav-link:nth-child(3) { animation: e-settle-down 0.50s var(--e-soft) 0.26s both; }
    html.anim .nav-link:nth-child(4) { animation: e-settle-down 0.50s var(--e-soft) 0.31s both; }
    html.anim header .cta { animation: e-settle-down 0.55s var(--e-soft) 0.34s both; }
    html.anim .h1 { animation: e-focus 1.00s var(--e-primary) 0.30s both; will-change: transform, opacity; }
    html.anim .card { animation: e-panel 0.90s var(--e-primary) 0.62s both; will-change: transform, opacity; }
    html.anim .ph { animation: e-populate 0.50s var(--e-soft) 0.88s both; }
    html.anim .chips { animation: e-populate 0.50s var(--e-soft) 0.94s both; }
    html.anim .right { animation: e-populate 0.50s var(--e-soft) 1.00s both; }
    html.anim .send { animation: e-send 0.50s var(--e-primary) 1.00s both; }
    html.anim .caption { animation: e-settle-up 0.55s var(--e-soft) 1.08s both; }
    html.anim .logos > :nth-child(1) { animation: e-settle-up 0.55s var(--e-soft) 1.16s both; }
    html.anim .logos > :nth-child(2) { animation: e-settle-up 0.55s var(--e-soft) 1.22s both; }
    html.anim .logos > :nth-child(3) { animation: e-settle-up 0.55s var(--e-soft) 1.28s both; }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 2) TABLET: 600-1180 wide AND height >= 600 */
    @media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
      :root {
        --u: 1px;
      }
      .burger, .sheet {
        display: none !important;
      }
      .frame {
        padding: clamp(24px, 3.4vh, 44px) clamp(28px, 4.2vw, 60px) clamp(26px, 4.4vh, 56px);
      }
      .h1 {
        font-size: clamp(27px, 4.3vw, 44px);
        line-height: 1.12;
      }
      .card {
        width: min(100%, clamp(516px, 74vw, 760px));
        height: auto;
        margin-right: 0;
        padding: clamp(15px, 1.9vw, 24px);
        border-radius: clamp(17px, 2.1vw, 26px);
        display: flex;
        flex-direction: column;
        gap: clamp(20px, 3.2vh, 44px);
      }
      .ph {
        position: static;
        white-space: normal;
        font-size: clamp(11px, 1.35vw, 14px);
        line-height: 1.4;
      }
      .tools {
        position: static;
        height: auto;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: clamp(10px, 1.4vw, 18px);
      }
      .chips {
        white-space: nowrap;
        gap: clamp(6px, 0.85vw, 10px);
      }
      .chip {
        width: auto;
        height: clamp(29px, 3.4vh, 34px);
        padding: 0 clamp(7px, 1vw, 13px);
        font-size: clamp(9.6px, 1.12vw, 12.5px);
      }
      .model {
        font-size: clamp(9.8px, 1.12vw, 12.5px);
      }
      .proof {
        gap: clamp(15px, 2.5vh, 30px);
      }
      .right {
        position: static;
        display: flex;
        align-items: center;
        margin-left: auto;
        gap: 0;
        pointer-events: auto;
      }
      .right > * {
        position: static;
      }
      .attach {
        margin-left: clamp(9px, 1.4vw, 20px);
      }
      .send {
        margin-left: clamp(9px, 1.3vw, 18px);
        width: clamp(32px, 3.5vw, 38px);
        height: clamp(32px, 3.5vw, 38px);
      }
    }

    /* 3) COMPACT: max-width 599px, OR max-height 599px with max-width 1180px */
    @media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
      :root {
        --u: 1px;
      }
      .frame {
        padding: max(18px, env(safe-area-inset-top, 0px))
                 max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-right, 0px))
                 max(20px, env(safe-area-inset-bottom, 0px))
                 max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-left, 0px));
      }
      .links, header.nav .cta {
        display: none !important;
      }
      .burger {
        display: flex;
      }
      .brand .mark {
        width: 30px;
        height: 30px;
      }
      .sheet {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.32s cubic-bezier(.4, 0, .2, 1);
        overflow: hidden;
        position: absolute;
        top: calc(max(18px, env(safe-area-inset-top, 0px)) + 55px);
        left: 20px;
        right: 20px;
        z-index: 20;
      }
      #menu:checked ~ .sheet {
        grid-template-rows: 1fr;
      }
      .sheet-panel {
        min-height: 0;
        background: rgba(24, 24, 27, 0.86);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .sheet-link {
        font-size: 15px;
        color: #fff;
        text-decoration: none;
        padding: 6px 0;
      }
      .sheet-cta {
        height: 40px;
        border-radius: 11px;
        font-size: 15px;
        font-weight: 520;
        background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      }
      .h1 {
        width: 100%;
        max-width: 15ch;
        font-size: clamp(29px, 7.6vw, 50px);
        line-height: 1.14;
        letter-spacing: -0.012em;
      }
      .card {
        width: 100%;
        max-width: 600px;
        height: auto;
        display: flex;
        flex-direction: column;
        gap: clamp(16px, 4.6vh, 34px);
        padding: clamp(13px, 3.4vw, 18px);
        margin-right: 0;
      }
      .ph {
        position: static;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        font-size: clamp(9.4px, 2.95vw, 14px);
      }
      .tools {
        position: static;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        width: auto;
        padding: 0 10px;
        height: 32px;
        font-size: 11px;
      }
      .right {
        position: static;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        pointer-events: auto;
      }
      .right > * {
        position: static;
      }
      .attach {
        margin-left: auto;
      }
      .send {
        margin-left: 14px;
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 1180px) and (max-height: 560px) {
      main.hero { gap: 16px; }
      .h1 { font-size: clamp(24px, 5.4vh, 34px); }
      footer.proof { gap: 10px; }
      .frame { padding-top: 10px; }
    }
  </style>
